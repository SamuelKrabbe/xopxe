spring:
  application:
    name: xopxe

  datasource:
    url: jdbc:postgresql://localhost:5432/xopxe
    username: xopxe
    password: xopxe

  jpa:
    # Quem cria as tabelas é o Flyway. O Hibernate só confere se bate com as entidades.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  # Tamanho máximo da imagem da capa.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # Os erros devolvem só a mensagem, sem a pilha.
  web:
    error:
      include-message: always
      include-stacktrace: never

# Origem do Vite em desenvolvimento, liberada no SecurityConfig.
xopxe:
  cors:
    allowed-origin: http://localhost:5173

  # Login com Google. Valores do .env, vazio desliga o login com Google.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Endereço de volta do Google. Só definido no Render.
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

# O cookie de sessão não vai em formulários de outros sites.
server:
  servlet:
    session:
      cookie:
        same-site: lax
