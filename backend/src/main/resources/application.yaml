spring:
  application:
    name: xopxe

  datasource:
    url: jdbc:postgresql://localhost:5432/xopxe
    username: xopxe
    password: xopxe

  jpa:
    # O Flyway é o dono do schema; o Hibernate só confere se bate com as entidades.
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  # Tamanho máximo da capa enviada. O front confere antes de mandar.
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # O front só precisa da mensagem do erro, não da pilha de exceção inteira.
  web:
    error:
      include-message: always
      include-stacktrace: never

# Origem do Vite em desenvolvimento, liberada no SecurityConfig.
xopxe:
  cors:
    allowed-origin: http://localhost:5173

  # Login com Google. Os valores vêm do .env; se ficarem vazios, o login com Google fica desligado.
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Endereço de volta do Google. Só é definido no Render; vazio, o Spring monta sozinho.
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
