server {
    listen 80;
    root /usr/share/nginx/html;

    # Estes caminhos vão para o backend; o resto é o site React.
    location ~ ^/(api|oauth2|login/oauth2|swagger-ui|v3/api-docs) {
        proxy_pass http://backend:8080;
        # Mantém "localhost:8000" para o Spring montar o endereço de volta do Google.
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri /index.html;
    }
}
